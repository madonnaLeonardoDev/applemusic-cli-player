[package]
name = "applemusic-cli"
version = "1.0.0"
edition = "2024"

[dependencies]
clap = {version = "4.6.7", features = ["derive"]}
crossterm = "0.29.0"
daemonize = "0.5.0"
futures-util = "0.3.34"
image = "0.25.10"
libc = "0.2.190"
reqwest = "0.13.5"
serde = "1.0.229"
serde_json = "1.0.151"
thirtyfour = "0.37.5"
tokio = { version = "1.53.2", features = ["full"] }
viuer = "0.11.0"
wincode = "0.6.3"
wincode-derive = "0.5.1"

[profile.release]
opt-level = 3        
lto = true            
codegen-units = 1     
strip = true          
